<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Job Finder - Leeds (Server Version)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // API URL - change this to your deployed server URL
        const API_URL = window.location.origin;

        // Icon components (same as before)
        const Search = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
        );

        const Bell = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
            </svg>
        );

        const BellOff = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M6.3 5.3a6 6 0 0 0 11.4 2.7"></path>
                <path d="M19 8.6c0 4.7 3 6.4 3 6.4H3s3-2 3-9c0-.3 0-.6.1-.9"></path>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
        );

        const Briefcase = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
        );

        const GraduationCap = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
        );

        const BookOpen = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        );

        const Filter = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
        );

        const RefreshCw = ({ className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
        );

        const Trash2 = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Plus = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        function JobScraper() {
            const [jobs, setJobs] = useState([]);
            const [filteredJobs, setFilteredJobs] = useState([]);
            const [activeJobs, setActiveJobs] = useState([]);
            const [loading, setLoading] = useState(false);
            const [notificationsEnabled, setNotificationsEnabled] = useState(false);
            const [lastChecked, setLastChecked] = useState(null);
            const [filter, setFilter] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                loadSavedJobs();
                checkNotificationStatus();
            }, []);

            useEffect(() => {
                applyFilters();
            }, [jobs, filter, searchTerm]);

            const loadSavedJobs = async () => {
                try {
                    const result = await window.storage.get('pm_jobs', false);
                    if (result) {
                        const data = JSON.parse(result.value);
                        setJobs(data.jobs || []);
                        setLastChecked(data.lastChecked || null);
                        setActiveJobs(data.jobs?.filter(j => j.isActive) || []);
                    }
                } catch (error) {
                    console.log('No saved jobs found');
                }
            };

            const saveJobs = async (newJobs, timestamp) => {
                try {
                    await window.storage.set('pm_jobs', JSON.stringify({
                        jobs: newJobs,
                        lastChecked: timestamp
                    }), false);
                } catch (error) {
                    console.error('Failed to save jobs:', error);
                }
            };

            const checkNotificationStatus = () => {
                if ('Notification' in window) {
                    setNotificationsEnabled(Notification.permission === 'granted');
                }
            };

            const toggleNotifications = async () => {
                if (!('Notification' in window)) {
                    alert('This browser does not support notifications');
                    return;
                }

                if (Notification.permission === 'granted') {
                    setNotificationsEnabled(!notificationsEnabled);
                } else if (Notification.permission !== 'denied') {
                    const permission = await Notification.requestPermission();
                    setNotificationsEnabled(permission === 'granted');
                }
            };

            const scrapeJobs = async () => {
                setLoading(true);
                try {
                    const response = await fetch(`${API_URL}/api/search-jobs`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });

                    const data = await response.json();
                    
                    if (!data.success) {
                        throw new Error(data.error || 'Failed to fetch jobs');
                    }

                    const jobsWithId = data.jobs.map((job, idx) => ({
                        ...job,
                        id: `${Date.now()}-${idx}`,
                        addedDate: new Date().toISOString(),
                        isActive: true
                    }));

                    const existingJobIds = new Set(jobs.map(j => `${j.title}-${j.company}`));
                    const mergedJobs = [...jobs, ...jobsWithId.filter(j => !existingJobIds.has(`${j.title}-${j.company}`))];

                    const timestamp = new Date().toISOString();
                    setJobs(mergedJobs);
                    setLastChecked(timestamp);
                    await saveJobs(mergedJobs, timestamp);

                    const currentlyActive = jobsWithId;
                    setActiveJobs(currentlyActive);

                    if (notificationsEnabled && jobsWithId.length > 0) {
                        new Notification('New PM Jobs Found!', {
                            body: `Found ${jobsWithId.length} active project management opportunities`,
                            icon: '💼'
                        });
                    }

                    alert(`✅ Success!\n\nFound ${jobsWithId.length} new job opportunities!`);
                } catch (error) {
                    console.error('Error scraping jobs:', error);
                    alert(`❌ Error: ${error.message}\n\nMake sure the server is running and configured correctly.`);
                } finally {
                    setLoading(false);
                }
            };

            const verifyExistingJobs = async () => {
                if (jobs.length === 0) {
                    alert('No saved jobs to verify. Please search for jobs first.');
                    return;
                }

                setLoading(true);
                try {
                    const response = await fetch(`${API_URL}/api/verify-jobs`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ jobs })
                    });

                    const data = await response.json();
                    
                    if (!data.success) {
                        throw new Error(data.error || 'Failed to verify jobs');
                    }

                    const verifiedIds = new Set(data.verifiedJobs.map(j => `${j.title.toLowerCase()}-${j.company.toLowerCase()}`));
                    
                    const updatedJobs = jobs.map(job => ({
                        ...job,
                        isActive: verifiedIds.has(`${job.title.toLowerCase()}-${job.company.toLowerCase()}`),
                        lastVerified: new Date().toISOString()
                    }));

                    const activeCount = updatedJobs.filter(j => j.isActive).length;
                    const inactiveCount = updatedJobs.length - activeCount;

                    const timestamp = new Date().toISOString();
                    setJobs(updatedJobs);
                    setLastChecked(timestamp);
                    await saveJobs(updatedJobs, timestamp);

                    setActiveJobs(updatedJobs.filter(j => j.isActive));

                    if (notificationsEnabled) {
                        new Notification('Jobs Verification Complete', {
                            body: `${activeCount} jobs still active, ${inactiveCount} jobs no longer available`,
                            icon: '✅'
                        });
                    }

                    alert(`Verification complete!\n\n✅ ${activeCount} jobs still active\n❌ ${inactiveCount} jobs no longer available`);
                } catch (error) {
                    console.error('Error verifying jobs:', error);
                    alert(`❌ Error: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const applyFilters = () => {
                let filtered = jobs;

                if (filter !== 'all') {
                    filtered = filtered.filter(job => 
                        job.level.toLowerCase() === filter.toLowerCase()
                    );
                }

                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    filtered = filtered.filter(job =>
                        job.title.toLowerCase().includes(term) ||
                        job.company.toLowerCase().includes(term) ||
                        job.location.toLowerCase().includes(term) ||
                        job.description.toLowerCase().includes(term)
                    );
                }

                setFilteredJobs(filtered);
            };

            const clearAllJobs = async () => {
                if (window.confirm('Are you sure you want to clear all saved jobs?')) {
                    setJobs([]);
                    setActiveJobs([]);
                    setLastChecked(null);
                    try {
                        await window.storage.delete('pm_jobs', false);
                    } catch (error) {
                        console.error('Failed to clear jobs:', error);
                    }
                }
            };

            const getLevelIcon = (level) => {
                switch(level.toLowerCase()) {
                    case 'apprenticeship':
                        return <BookOpen />;
                    case 'graduate':
                        return <GraduationCap />;
                    default:
                        return <Briefcase />;
                }
            };

            const getLevelColor = (level) => {
                switch(level.toLowerCase()) {
                    case 'apprenticeship':
                        return 'bg-blue-100 text-blue-800 border-blue-300';
                    case 'graduate':
                        return 'bg-purple-100 text-purple-800 border-purple-300';
                    default:
                        return 'bg-green-100 text-green-800 border-green-300';
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-6">
                    <div className="max-w-6xl mx-auto">
                        {/* Server Status Banner */}
                        <div className="bg-green-100 border border-green-400 rounded-xl p-4 mb-6">
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                                <p className="text-green-800 font-semibold">🚀 Server Version - Full AI Job Search Enabled</p>
                            </div>
                        </div>

                        {/* Header */}
                        <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-900 mb-2">
                                        PM Job Finder
                                    </h1>
                                    <p className="text-gray-600">
                                        Entry, Apprenticeship & Graduate PM Roles - Leeds (30 mile radius) - Last 30 Days
                                    </p>
                                </div>
                                <Briefcase className="w-12 h-12 text-indigo-600" />
                            </div>

                            <div className="flex flex-wrap gap-3">
                                <button
                                    onClick={scrapeJobs}
                                    disabled={loading}
                                    className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:bg-gray-400 transition-colors"
                                >
                                    <RefreshCw className={loading ? 'animate-spin' : ''} />
                                    {loading ? 'Searching...' : 'Search Jobs'}
                                </button>

                                <button
                                    onClick={verifyExistingJobs}
                                    disabled={loading || jobs.length === 0}
                                    className="flex items-center gap-2 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 disabled:bg-gray-400 transition-colors"
                                >
                                    <Filter />
                                    Verify Saved Jobs
                                </button>

                                <button
                                    onClick={toggleNotifications}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                                        notificationsEnabled
                                            ? 'bg-green-600 text-white hover:bg-green-700'
                                            : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                    }`}
                                >
                                    {notificationsEnabled ? <Bell /> : <BellOff />}
                                    {notificationsEnabled ? 'Notifications On' : 'Enable Notifications'}
                                </button>

                                <button
                                    onClick={clearAllJobs}
                                    className="flex items-center gap-2 px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition-colors"
                                >
                                    <Trash2 />
                                    Clear All
                                </button>
                            </div>

                            {lastChecked && (
                                <p className="text-sm text-gray-500 mt-3">
                                    Last checked: {new Date(lastChecked).toLocaleString()}
                                </p>
                            )}
                        </div>

                        {/* Filters */}
                        <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                            <div className="flex flex-wrap gap-4">
                                <div className="flex-1 min-w-64">
                                    <div className="relative">
                                        <div className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                                            <Search />
                                        </div>
                                        <input
                                            type="text"
                                            placeholder="Search jobs..."
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                    </div>
                                </div>

                                <div className="flex gap-2">
                                    {['all', 'entry', 'apprenticeship', 'graduate'].map((level) => (
                                        <button
                                            key={level}
                                            onClick={() => setFilter(level)}
                                            className={`px-4 py-2 rounded-lg transition-colors capitalize ${
                                                filter === level
                                                    ? 'bg-indigo-600 text-white'
                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                            }`}
                                        >
                                            {level}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="mt-4 flex flex-wrap gap-4 text-sm">
                                <div className="flex items-center gap-2 text-gray-600">
                                    <span className="font-semibold">Showing:</span>
                                    <span>{filteredJobs.length} of {jobs.length} total jobs</span>
                                </div>
                                <div className="flex items-center gap-2 text-green-600">
                                    <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                                    <span className="font-semibold">{activeJobs.length} currently active jobs found in last search</span>
                                </div>
                            </div>
                        </div>

                        {/* Currently Active Jobs Section */}
                        {activeJobs.length > 0 && (
                            <div className="bg-gradient-to-r from-green-50 to-emerald-50 border-2 border-green-300 rounded-xl shadow-lg p-6 mb-6">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                                    <h2 className="text-2xl font-bold text-green-900">
                                        Currently Active Jobs ({activeJobs.length})
                                    </h2>
                                </div>
                                <p className="text-green-800 mb-4">
                                    These jobs are currently live on job sites (as of latest search: {lastChecked ? new Date(lastChecked).toLocaleString() : 'Never'})
                                </p>
                                
                                <div className="bg-white rounded-lg p-4 mb-4">
                                    <h3 className="font-semibold text-gray-900 mb-2">Active Jobs by Level:</h3>
                                    <div className="flex gap-4 text-sm">
                                        <div className="flex items-center gap-2">
                                            <Briefcase />
                                            <span>Entry: {activeJobs.filter(j => j.level.toLowerCase() === 'entry').length}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <BookOpen />
                                            <span>Apprenticeship: {activeJobs.filter(j => j.level.toLowerCase() === 'apprenticeship').length}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <GraduationCap />
                                            <span>Graduate: {activeJobs.filter(j => j.level.toLowerCase() === 'graduate').length}</span>
                                        </div>
                                    </div>
                                </div>

                                <p className="text-sm text-green-700 italic">
                                    💡 Tip: This includes jobs posted within the last 30 days. Click "Search Jobs" regularly to capture both new postings and ongoing opportunities
                                </p>
                            </div>
                        )}

                        {/* Job Listings */}
                        <div className="space-y-4">
                            {filteredJobs.length === 0 && !loading && (
                                <div className="bg-white rounded-xl shadow-lg p-12 text-center">
                                    <Briefcase className="w-16 h-16 text-gray-400 mx-auto mb-4" />
                                    <h3 className="text-xl font-semibold text-gray-700 mb-2">
                                        No Jobs Found
                                    </h3>
                                    <p className="text-gray-500 mb-6">
                                        Click "Search Jobs" to find the latest project management opportunities
                                    </p>
                                </div>
                            )}

                            {filteredJobs.map((job) => (
                                <div
                                    key={job.id}
                                    className={`bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition-shadow ${
                                        job.isActive ? 'border-2 border-green-400' : 'border-2 border-gray-300 opacity-75'
                                    }`}
                                >
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="flex-1">
                                            <div className="flex items-center gap-3 mb-2 flex-wrap">
                                                {job.isActive ? (
                                                    <span className="flex items-center gap-1 px-2 py-1 bg-green-100 text-green-800 rounded-full text-xs font-semibold border border-green-300">
                                                        <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                                                        ACTIVE NOW
                                                    </span>
                                                ) : (
                                                    <span className="flex items-center gap-1 px-2 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-semibold border border-gray-300">
                                                        <span className="w-2 h-2 bg-gray-400 rounded-full"></span>
                                                        NO LONGER ACTIVE
                                                    </span>
                                                )}
                                                <h3 className="text-xl font-semibold text-gray-900">
                                                    {job.title}
                                                </h3>
                                                <span className={`flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium border ${getLevelColor(job.level)}`}>
                                                    {getLevelIcon(job.level)}
                                                    {job.level}
                                                </span>
                                            </div>
                                            <p className="text-indigo-600 font-medium mb-1">{job.company}</p>
                                            <p className="text-gray-600 text-sm">{job.location}</p>
                                            {job.lastVerified && (
                                                <p className="text-xs text-gray-500 mt-1">
                                                    Last verified: {new Date(job.lastVerified).toLocaleString()}
                                                </p>
                                            )}
                                        </div>
                                        {job.salary && (
                                            <div className="text-right">
                                                <p className="text-lg font-semibold text-gray-900">{job.salary}</p>
                                            </div>
                                        )}
                                    </div>

                                    <p className="text-gray-700 mb-4">{job.description}</p>

                                    <div className="flex justify-between items-center pt-4 border-t border-gray-200">
                                        <div className="flex gap-4 text-sm text-gray-500">
                                            <span>📍 {job.source}</span>
                                            {job.postedDate && <span>🕒 {job.postedDate}</span>}
                                        </div>
                                        {job.url && (
                                            <a
                                                href={job.url}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors"
                                            >
                                                Apply Now
                                            </a>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Info Box */}
                        <div className="mt-6 bg-indigo-50 border border-indigo-200 rounded-xl p-6">
                            <h4 className="font-semibold text-indigo-900 mb-2">💡 How it works</h4>
                            <ul className="text-sm text-indigo-800 space-y-1">
                                <li>• Click "Search Jobs" to find PM opportunities using AI-powered search across major UK job sites</li>
                                <li>• Searches for jobs posted within the last 30 days that are still accepting applications</li>
                                <li>• Click "Verify Saved Jobs" to check if your previously saved jobs are still active</li>
                                <li>• Covers Leeds and 30-mile radius: Bradford, Wakefield, Huddersfield, York, Harrogate, and more</li>
                                <li>• Enable notifications to get alerts when new jobs are found</li>
                                <li>• All jobs are saved locally in your browser and persist between sessions</li>
                                <li>• Filter by level (entry/apprenticeship/graduate) or search by keywords</li>
                            </ul>
                            
                            <h4 className="font-semibold text-indigo-900 mb-2 mt-4">🔍 Trusted Job Sites Searched</h4>
                            <div className="text-sm text-indigo-800 flex flex-wrap gap-2">
                                <span className="bg-white px-2 py-1 rounded">Indeed</span>
                                <span className="bg-white px-2 py-1 rounded">Reed</span>
                                <span className="bg-white px-2 py-1 rounded">Totaljobs</span>
                                <span className="bg-white px-2 py-1 rounded">CV Library</span>
                                <span className="bg-white px-2 py-1 rounded">LinkedIn</span>
                                <span className="bg-white px-2 py-1 rounded">Glassdoor</span>
                                <span className="bg-white px-2 py-1 rounded">Gov.uk Jobs</span>
                                <span className="bg-white px-2 py-1 rounded">Monster</span>
                                <span className="bg-white px-2 py-1 rounded">Michael Page</span>
                                <span className="bg-white px-2 py-1 rounded">CWJobs</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<JobScraper />, document.getElementById('root'));
